name: Test

on:
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref_type != 'tag' }}

jobs:
  tooling:
    name: Tooling and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code styles
        run: pnpm lint

      - name: Test release classification
        run: node scripts/release-metadata.test.js

      - name: Build CommonJS and ECMAScript packages
        run: pnpm build

      - name: Generate documents
        run: pnpm run docs

      - name: Test with coverage
        run: pnpm test:ci

      - name: Upload coverage to Codecov
        if: github.event_name != 'schedule'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

      - name: Pack the release artifact
        run: pnpm pack --out artifacts/package.tgz

      - name: Check the packed package
        run: pnpm test:package

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/package.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/
          if-no-files-found: error

  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    needs: tooling
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Node 14 has no native Apple Silicon binary.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node-version: [14, 16, 18, 20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false

      - name: Install dependencies using the tooling runtime
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts/

      - name: Select the compatibility runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Run the full unit suite
        run: pnpm test --ci --maxWorkers=2

      - name: Check packed CommonJS and ECMAScript exports
        run: pnpm test:package
