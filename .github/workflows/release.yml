name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7
      - name: Match the tag to package.json and select the release channel
        id: version
        run: node scripts/release-metadata.js
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  test:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/test.yml

  publish-npm:
    name: Publish to NPM
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    environment:
      name: npm
      url: https://www.npmjs.com/package/prototyped.js

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - uses: pnpm/setup@v1
        with:
          install: false

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts/

      - name: Publish the tested tarball using trusted publishing
        run: pnpm publish artifacts/package.tgz --no-git-checks --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ needs.prepare.outputs.dist-tag }}

  release:
    name: Create Release
    needs: [prepare, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog
        uses: ardalanamini/auto-changelog@v5
        id: changelog

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'false' && 'true' || 'false' }}

  publish-documents:
    name: Publish Documents
    needs: [prepare, publish-npm]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: documents
      url: ${{ steps.github-pages-deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - uses: actions/configure-pages@v6

      - uses: actions/download-artifact@v8
        with:
          name: documentation
          path: docs/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: github-pages-deployment
        uses: actions/deploy-pages@v5
