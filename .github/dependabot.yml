version: 2

updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    cooldown:
      default-days: 1
    commit-message:
      prefix: deps(CI)

  # Maintain dependencies for NPM
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    cooldown:
      default-days: 1
    versioning-strategy: increase
    commit-message:
      prefix: deps
      prefix-development: deps(Dev)
